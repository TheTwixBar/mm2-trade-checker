name: Update MM2 Values

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at midnight UTC
  workflow_dispatch:        # also lets you trigger it manually from GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python sv_scraper.py
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_TOKEN }}

      - name: Commit and push updated values
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_txt/mm2values.txt
          git diff --cached --quiet || git commit -m "chore: update mm2values.txt [$(date -u '+%Y-%m-%d')]"
          git push
